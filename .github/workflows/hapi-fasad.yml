# Bygger och testar HAPI FHIR-fasaden (modul 5) och provkör den.
#
# Fasaden hämtar data från journalsystemets proprietära REST-API och mappar den till FHIR med
# FHIR Mapping Language (hapi-fasad/src/main/resources/fml/*.map).
#
# Körs när du checkar in en ändring under hapi-fasad/, t.ex. i en .map-fil. Källdatan och
# FHIR-resultatet visas sida vid sida i jobbets sammanfattning (fliken Actions -> körningen).
name: HAPI-fasad

on:
  push:
    paths:
      - 'hapi-fasad/**'
      - '.github/workflows/hapi-fasad.yml'
  workflow_dispatch:

concurrency:
  group: hapi-fasad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Bygg, testa och provkör
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hapi-fasad
    steps:
      - uses: actions/checkout@v4

      - name: Installera Java och Maven-cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bygg och kör tester
        run: mvn -B verify

      - name: Starta fasaden
        run: |
          nohup java -jar target/hapi-fasad-0.1.0.jar > fasad.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/fhir/metadata > /dev/null && exit 0
            sleep 1
          done
          cat fasad.log
          exit 1

      - name: Provkör API:t
        run: |
          BASE=http://localhost:8080
          visa() {
            echo "#### \`GET $1\`"
            echo ""
            echo '```json'
            curl -s "$BASE$1" | jq .
            echo '```'
            echo ""
          }
          {
            echo "## Provkörning av FHIR-fasaden"
            echo ""
            echo "### Patient: källa och resultat"
            echo ""
            echo "Journalsystemets eget API (källan) och samma patient som FHIR efter mappningen i \`fml/patient.map\`."
            echo ""
            visa "/journalsystem-api/patienter/191212121212"
            visa "/fhir/Patient/191212121212"
            echo "### Vårdkontakter: källa och resultat"
            echo ""
            echo "Mappning i \`fml/besok.map\`. Titta på besöket med kontakttypen DIG (övning 5.3)."
            echo ""
            visa "/journalsystem-api/patienter/194208106593/besok"
            visa "/fhir/Encounter?patient=194208106593"
            echo "### CapabilityStatement i korthet (\`GET /fhir/metadata\`)"
            echo ""
            echo "| Resurs | Interaktioner | Sökparametrar | Profil |"
            echo "|---|---|---|---|"
            curl -s "$BASE/fhir/metadata" | jq -r '.rest[0].resource[] | "| \(.type) | \([.interaction[]?.code] | join(", ")) | \([.searchParam[]?.name] | join(", ")) | \(.supportedProfile // [] | join(", ")) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tips vid fel
        if: failure()
        run: |
          {
            echo "## ❌ Bygget misslyckades"
            echo ""
            echo "- **Fel i en .map-fil?** Öppna steget *Bygg och kör tester* och sök efter \`FHIRLexerException\`."
            echo "  Felet anges som \`Error @rad, kolumn\`. Vanliga orsaker: saknat semikolon, citattecken eller \`->\`."
            echo "- **Fel i Java-koden?** Leta efter \`COMPILATION ERROR\` i samma steg."
          } >> "$GITHUB_STEP_SUMMARY"
